<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>静池 · Zen Desktop</title><link rel="stylesheet" href="style.css"></head>
<body><main id="pond" aria-label="赏鱼壁纸，单击投喂，双击切换桌面图标"><canvas id="water"></canvas><canvas id="fish"></canvas><canvas id="rain-impact" aria-hidden="true"></canvas></main>
<aside id="calendar" class="calendar glass" aria-label="日历"><div id="solar"></div><div id="lunar"></div><div class="countdown" id="countdown"></div></aside>
<button class="settings-button glass" id="settings-button" aria-label="打开设置"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M3 6h18M3 12h18M3 18h18"/><circle cx="9" cy="6" r="2"/><circle cx="16" cy="12" r="2"/><circle cx="7" cy="18" r="2"/></svg></button>
<section id="settings" class="glass" hidden aria-label="壁纸设置"><header><div><h1>静池</h1><p>留一方水，安放片刻。</p></div><button id="close" aria-label="关闭设置">×</button></header>
<nav class="settings-tabs" role="tablist" aria-label="设置分类"><button id="wallpaper-tab" role="tab" aria-selected="true" aria-controls="wallpaper-options">壁纸设置</button><button id="software-tab" role="tab" aria-selected="false" aria-controls="software-options" tabindex="-1">软件设置</button></nav>
<div id="wallpaper-options" role="tabpanel" aria-labelledby="wallpaper-tab"><div class="section-label">场景</div><div class="scenes" id="scenes"></div>
<div class="section-label">赏鱼 · 场景设置</div><label>鱼的种类 <span>选择 2—3 种</span></label><div id="species" class="species"></div>
<label for="count">鱼的数量 <output id="count-value"></output></label><input id="count" type="range" min="6" max="32" step="1">
<label for="speed">基准游速 <output id="speed-value"></output></label><input id="speed" type="range" min="0.4" max="1.8" step="0.1">
<label class="toggle-row">小雨<input id="rain" type="checkbox" role="switch"></label>
</div><div id="software-options" role="tabpanel" aria-labelledby="software-tab" hidden><div class="section-label">桌面</div><p class="compatibility-note">若壁纸未显示，请检查桌面整理软件是否覆盖了壁纸层，例如腾讯桌面整理。</p><label class="toggle-row">显示日历<input id="show-calendar" type="checkbox" role="switch"></label>
<label class="toggle-row">隐藏桌面图标<input id="icons" type="checkbox" role="switch"></label>
<div class="section-label">声音</div><label class="toggle-row">开启声音<input id="sound" type="checkbox" role="switch"></label>
<label for="volume">音乐音量 <output id="volume-value"></output></label><input id="volume" type="range" min="0" max="100">
<div class="music-row"><span id="music-name">未选择音乐</span><button id="replace-music">选择音乐</button><button id="restore-music">移除音乐</button></div><input id="music-file" type="file" accept="audio/*" hidden>
</div>
<footer><span>单击投喂 · 双击切换图标</span><button id="quit">退出壁纸</button></footer><p id="status" role="status"></p></section>
<div id="toast" role="status"></div><script src="lunar.js"></script><script type="module" src="app.js"></script></body></html>
